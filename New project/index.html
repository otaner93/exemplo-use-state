<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro com useState</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7fb;
        --surface: #ffffff;
        --text: #172033;
        --muted: #667085;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --line: #d9e0ec;
        --success: #0f766e;
        --shadow: 0 18px 45px rgba(23, 32, 51, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      #root {
        min-height: 100vh;
      }

      .page {
        width: min(1040px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0;
        display: grid;
        gap: 24px;
      }

      .header {
        display: grid;
        gap: 8px;
      }

      .header h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.2rem);
        letter-spacing: 0;
      }

      .header p {
        margin: 0;
        max-width: 680px;
        color: var(--muted);
        line-height: 1.6;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(280px, 1fr) minmax(280px, 420px);
        gap: 20px;
        align-items: start;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .form {
        padding: 24px;
        display: grid;
        gap: 16px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      label {
        font-weight: 700;
        font-size: 0.95rem;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 14px;
        font: inherit;
        color: var(--text);
        background: #fff;
      }

      textarea {
        min-height: 96px;
        resize: vertical;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: 3px solid rgba(37, 99, 235, 0.16);
        border-color: var(--primary);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding-top: 4px;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 12px 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .primary {
        background: var(--primary);
        color: #fff;
      }

      .primary:hover {
        background: var(--primary-dark);
      }

      .secondary {
        background: #eef2f8;
        color: var(--text);
      }

      .preview {
        padding: 24px;
        display: grid;
        gap: 18px;
      }

      .preview h2,
      .result h2 {
        margin: 0;
        font-size: 1.25rem;
      }

      .preview-list {
        display: grid;
        gap: 12px;
      }

      .preview-item {
        display: grid;
        gap: 4px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }

      .preview-item span {
        color: var(--muted);
        font-size: 0.85rem;
        font-weight: 700;
      }

      .preview-item strong {
        font-size: 1rem;
        overflow-wrap: anywhere;
      }

      .result {
        padding: 18px 24px 24px;
        display: grid;
        gap: 12px;
        border-top: 1px solid var(--line);
      }

      .success {
        margin: 0;
        color: var(--success);
        font-weight: 700;
      }

      .empty {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      @media (max-width: 820px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useState } = React;

      const estadoInicial = {
        nome: "",
        email: "",
        telefone: "",
        cargo: "",
        senha: "",
        observacoes: "",
      };

      function App() {
        const [formulario, setFormulario] = useState(estadoInicial);
        const [cadastroEnviado, setCadastroEnviado] = useState(null);

        function atualizarCampo(event) {
          const { name, value } = event.target;

          setFormulario((dadosAtuais) => ({
            ...dadosAtuais,
            [name]: value,
          }));
        }

        function enviarFormulario(event) {
          event.preventDefault();
          setCadastroEnviado(formulario);
        }

        function limparFormulario() {
          setFormulario(estadoInicial);
          setCadastroEnviado(null);
        }

        return (
          <main className="page">
            <header className="header">
              <h1>Formulário de cadastro</h1>
              <p>
                Exemplo simples em React usando <strong>useState</strong> para controlar os
                campos, atualizar o preview em tempo real e guardar os dados enviados.
              </p>
            </header>

            <section className="layout">
              <div className="panel">
                <form className="form" onSubmit={enviarFormulario}>
                  <div className="field">
                    <label htmlFor="nome">Nome completo</label>
                    <input
                      id="nome"
                      name="nome"
                      type="text"
                      value={formulario.nome}
                      onChange={atualizarCampo}
                      placeholder="Ex.: Ana Souza"
                      required
                    />
                  </div>

                  <div className="field">
                    <label htmlFor="email">E-mail</label>
                    <input
                      id="email"
                      name="email"
                      type="email"
                      value={formulario.email}
                      onChange={atualizarCampo}
                      placeholder="ana@email.com"
                      required
                    />
                  </div>

                  <div className="field">
                    <label htmlFor="telefone">Telefone</label>
                    <input
                      id="telefone"
                      name="telefone"
                      type="tel"
                      value={formulario.telefone}
                      onChange={atualizarCampo}
                      placeholder="(11) 99999-9999"
                    />
                  </div>

                  <div className="field">
                    <label htmlFor="cargo">Área de interesse</label>
                    <select
                      id="cargo"
                      name="cargo"
                      value={formulario.cargo}
                      onChange={atualizarCampo}
                      required
                    >
                      <option value="">Selecione uma opção</option>
                      <option value="Frontend">Frontend</option>
                      <option value="Backend">Backend</option>
                      <option value="UX/UI Design">UX/UI Design</option>
                      <option value="Dados">Dados</option>
                    </select>
                  </div>

                  <div className="field">
                    <label htmlFor="senha">Senha</label>
                    <input
                      id="senha"
                      name="senha"
                      type="password"
                      value={formulario.senha}
                      onChange={atualizarCampo}
                      placeholder="Digite uma senha"
                      minLength="6"
                      required
                    />
                  </div>

                  <div className="field">
                    <label htmlFor="observacoes">Observações</label>
                    <textarea
                      id="observacoes"
                      name="observacoes"
                      value={formulario.observacoes}
                      onChange={atualizarCampo}
                      placeholder="Conte algo importante para o cadastro"
                    />
                  </div>

                  <div className="actions">
                    <button className="primary" type="submit">
                      Cadastrar
                    </button>
                    <button className="secondary" type="button" onClick={limparFormulario}>
                      Limpar
                    </button>
                  </div>
                </form>

                <div className="result">
                  <h2>Último envio</h2>
                  {cadastroEnviado ? (
                    <p className="success">
                      Cadastro de {cadastroEnviado.nome} enviado com sucesso.
                    </p>
                  ) : (
                    <p className="empty">Nenhum cadastro enviado ainda.</p>
                  )}
                </div>
              </div>

              <aside className="panel preview" aria-live="polite">
                <h2>Preview do estado local</h2>
                <div className="preview-list">
                  <PreviewItem titulo="Nome" valor={formulario.nome} />
                  <PreviewItem titulo="E-mail" valor={formulario.email} />
                  <PreviewItem titulo="Telefone" valor={formulario.telefone} />
                  <PreviewItem titulo="Área" valor={formulario.cargo} />
                  <PreviewItem titulo="Senha" valor={formulario.senha ? "******" : ""} />
                  <PreviewItem titulo="Observações" valor={formulario.observacoes} />
                </div>
              </aside>
            </section>
          </main>
        );
      }

      function PreviewItem({ titulo, valor }) {
        return (
          <div className="preview-item">
            <span>{titulo}</span>
            <strong>{valor || "Ainda não informado"}</strong>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
